name: CI Test Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django deploy check
        env:
          DEMO_MODE: '0'
          DEBUG: '0'
          HTTPS: '1'
          SECRET_KEY: 'ci-deploy-check-key-not-used-in-production-1234567890'
          ALLOWED_HOSTS: 'projektakte.example.com,127.0.0.1'
        run: python manage.py check --deploy

      - name: Run Django test suite
        env:
          DEMO_MODE: '1'
          HTTPS: '0'
          ALLOWED_HOSTS: '127.0.0.1,localhost,testserver'
        run: python manage.py test --verbosity=1
