name: projektakte
x-app: &app
  build:
    context: .
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14.10-slim-trixie}
  image: projektakte:0.7.30
  env_file: ${PROJEKTAKTE_ENV_FILE:-.env}
  environment:
    DATA_DIR: /data
  volumes:
    - ${APP_DATA_DIR:-./data}:/data
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777
  read_only: true
services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8010}:8000"
    command: ["python", "serve.py", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-m", "akte.healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 3
  worker:
    <<: *app
    command: ["python", "manage.py", "worker"]
    healthcheck:
      test: ["CMD", "python", "scripts/worker_health.py"]
      interval: 30s
      timeout: 8s
      retries: 3
