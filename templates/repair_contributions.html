<section class="panel">
  <h2>Eigene Ergänzungen</h2>
  <a class="btn secondary" href="{% url 'knowledge_new' %}?project={{ project.pk }}&amp;library={{ library.pk }}{% if doc %}&amp;repair={{ doc.id }}{% endif %}">Notiz, Link oder YouTube-Video hinzufügen</a>
  {% for item in contributions %}
    <p><a href="{% url 'knowledge_detail' item.pk %}">{{ item.title }}</a>{% if item.youtube_id %} · YouTube{% endif %}</p>
  {% empty %}
    <p class="muted">Hier kannst du eigene Hinweise zu den BMW-Originalunterlagen ablegen.</p>
  {% endfor %}
</section>
