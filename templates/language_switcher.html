{% load i18n %}<form method="post" action="{% url 'set_language' %}" class="lang-switcher" aria-label="{% trans 'Sprache wählen' %}" style="display:inline-flex;gap:6px;align-items:center">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button type="submit" name="language" value="de" class="{% if current_language == 'de' %}secondary{% else %}ghost{% endif %}" {% if current_language == 'de' %}aria-current="true"{% endif %}>DE</button><button type="submit" name="language" value="en" class="{% if current_language == 'en' %}secondary{% else %}ghost{% endif %}" {% if current_language == 'en' %}aria-current="true"{% endif %}>EN</button></form>
